name: Check synthetic CAPL example
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-tested.txt
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m capl_analysis.pipeline --input examples/capl_synthetic_long.csv --output outputs/ci --quick
